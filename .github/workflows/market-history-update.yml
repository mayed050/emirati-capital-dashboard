name: Daily market history update

on:
  schedule:
    # 12:30 UTC is 16:30 in the UAE, after DFM and ADX close on their Monday to Friday sessions
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The history script needs Node's built-in WebSocket
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update market history
        run: npm run update:history

      - name: Validate data coverage
        run: npm run validate:data

      - name: Commit updated history
        run: |
          if git diff --quiet -- src/data/generated/market-history.json src/data/generated/average-volumes.json; then
            echo "No market history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/market-history.json src/data/generated/average-volumes.json
          git commit -m "chore: update market history [skip ci]"
          # The 5-minute price sync may have pushed since checkout
          git pull --rebase origin main
          git push
