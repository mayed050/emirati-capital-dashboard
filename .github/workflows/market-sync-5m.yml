name: Continuous 5m Market Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute Live Sync Daemon (Once)
        run: npm run start:daemon -- --once
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      - name: Validate data coverage
        run: npm run validate:data

      - name: Commit and Push Updated Market Data
        run: |
          if git diff --quiet -- src/data/generated/market-overrides.json; then
            echo "No changes in market overrides to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/market-overrides.json
          git commit -m "chore: auto-sync live market prices [skip ci]"
          git push
