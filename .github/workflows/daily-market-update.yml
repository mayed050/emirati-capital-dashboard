name: Daily market data update

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update market data
        env:
          MARKET_DATA_SNAPSHOT_URL: ${{ secrets.MARKET_DATA_SNAPSHOT_URL }}
          MARKET_DATA_SNAPSHOT_FILE: ${{ vars.MARKET_DATA_SNAPSHOT_FILE }}
        run: npm run update:data

      - name: Validate data coverage
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- src/data/generated/market-overrides.json; then
            echo "No market data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/market-overrides.json
          git commit -m "Update daily market data snapshot"
          git push
